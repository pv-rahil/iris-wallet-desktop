  cleanup-artifacts:
    name: Cleanup Artifacts
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-dogtail]
    steps:
      - name: Delete Test Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            allure-results/${{ matrix.test_file }}-${{ matrix.wallet_variant }}
            coverage-report
          failOnError: false

