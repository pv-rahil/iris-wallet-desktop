name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gobject-introspection \
            libgirepository1.0-dev \
            libcairo2-dev \
            libffi-dev \
            build-essential \
            python3-dev \
            meson \
            ninja-build \
            pkg-config \
            gir1.2-gtk-3.0

      - name: Install Python dependencies (project)
        uses: ./.github/actions/install-python-dependencies

      - name: Generate config.py
        run: |
          cd src/utils
          python generate_config.py

      - name: Compile QT resources
        run: |
          poetry run pyside6-rcc src/resources.qrc -o src/resources_rc.py

      - name: Code quality checks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      TZ: Asia/Kolkata
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3 environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libegl1 \
            libgl1 \
            ruby-dev \
            build-essential \
            libgirepository1.0-dev \
            python3-dev \
            libfuse2 \
            gobject-introspection \
            meson \
            ninja-build \
            pkg-config \
            libcairo2-dev \
            libffi-dev \
            libhidapi-hidraw0 \
            libhidapi-libusb0 \
            libhidapi-dev
          sudo gem install fpm -f

      - name: Generate config.py
        run: |
          cd src/utils
          python generate_config.py

      - name: Preinstall keyring backends (system Python)
        run: |
          pip install keyring keyrings.alt

      - name: Install Python dependencies
        uses: ./.github/actions/install-python-dependencies

      - name: Install keyring backends in Poetry venv
        run: |
          poetry run pip install keyring keyrings.alt

      - name: Set KEYRING_HOME env
        run: |
          echo "KEYRING_HOME=$RUNNER_TEMP/keyring" >> "$GITHUB_ENV"

      - name: Ensure keyring storage directory exists
        run: |
          mkdir -p "$KEYRING_HOME"

      - name: Compile QT resources
        run: |
          poetry run pyside6-rcc src/resources.qrc -o src/resources_rc.py

      - name: Run unit tests (fail if coverage < 90%)
        run: |
          poetry run pytest -v --maxfail=1 -n 4\
            --cov=src \
            --cov-fail-under=90 \
            --cov-report=html:coverage-report \
            unit_tests/tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 7
          if-no-files-found: ignore

  e2e-dogtail:
    name: E2E Dogtail tests
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        test_file:
          # - test_keyring_dialog
          # - test_receive_and_send_bitcoin
          # - test_login_app_auth
          # - test_ask_auth_for_imp_operations
          # - test_settings
          - test_help
          # - test_about
          # - test_backup_and_restore
          # - test_send_and_receive_nia_asset
          # - test_send_and_receive_ifa_asset
          # - test_send_and_receive_cfa_asset
          # - test_hide_exhausted_asset
          # - test_fail_transfer
          # - test_issue_nia_asset
          # - test_issue_ifa_asset
          # - test_issue_cfa_asset
          # - test_view_unspent
          # - test_refresh_transfer
          # - test_inflate_asset
        wallet_variant:
          # All single-sig variants
          # - online_watch_only
          # - online_create_on_device
          # - online_create_hardware
          # - online_load_on_device
          # - online_load_hardware
          # - offline_create_on_device
          # - offline_create_hardware
          # - offline_load_on_device
          # - offline_load_hardware
          - online_multisig_on_device

    env:
      DISPLAY: :99
      QT_IM_MODULE: virtualkeyboard
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install E2E system dependencies
        uses: ./.github/actions/install-e2e-dependencies

      - name: Setup env for GUI testing
        run: |
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> $GITHUB_ENV
          echo "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe" >> $GITHUB_ENV
          # Qt-specific software OpenGL settings
          echo "QT_OPENGL=software" >> $GITHUB_ENV
          echo "QT_QUICK_BACKEND=software" >> $GITHUB_ENV
          echo "QSG_RENDER_LOOP=basic" >> $GITHUB_ENV

      - name: Preinstall keyring backends (system Python)
        run: |
          pip install keyring keyrings.alt

      - name: Install Python dependencies
        uses: ./.github/actions/install-python-dependencies

      - name: Install keyring backends in Poetry venv
        run: |
          poetry run pip install keyring keyrings.alt

      - name: Start Xvfb with GLX & openbox
        run: |
          XAUTH="$RUNNER_TEMP/.Xauthority"
          touch "$XAUTH"; echo "XAUTHORITY=$XAUTH" >> $GITHUB_ENV
          xauth -f "$XAUTH" add :99 . $(mcookie)

          # Start Xvfb with GLX extension enabled
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 5
          # Wait for X to be ready
          for i in {1..30}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          openbox & sleep 3

      - name: Compile QT resources
        run: |
          poetry run pyside6-rcc src/resources.qrc -o src/resources_rc.py

      - name: Prepare runtime Python deps for AppImage
        run: |
          RUNTIME_PYDEPS="$RUNNER_TEMP/pydeps"
          mkdir -p "$RUNTIME_PYDEPS"
          python -m pip install --target "$RUNTIME_PYDEPS" keyring keyrings.alt
          echo "PYTHONPATH=$RUNTIME_PYDEPS" >> $GITHUB_ENV

      - name: Start regtest services
        run: poetry run regtest-start

      - name: Configure Qt for accurate Dogtail positioning
        run: |
          # Qt applications use window effects and platform themes that can cause click offsets
          # Disable these for accurate Dogtail element positioning
          echo "QT_STYLE_OVERRIDE=Fusion" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORMTHEME=" >> $GITHUB_ENV
          echo "QT_ENABLE_HIGHDPI_SCALING=0" >> $GITHUB_ENV
          echo "QT_AUTO_SCREEN_SCALE_FACTOR=0" >> $GITHUB_ENV
          # Disable GTK client-side decorations to prevent window shadows from offsetting click coordinates
          echo "GTK_CSD=0" >> $GITHUB_ENV

      - name: Start screen recording
        run: |
          # Install ffmpeg for screen recording
          sudo apt-get install -y ffmpeg

          # Start recording the virtual display
          ffmpeg -video_size 1920x1080 -framerate 15 -f x11grab -i :99.0 \
            -codec:v libx264 -preset ultrafast -crf 28 \
            /tmp/test_recording_${{ matrix.test_file }}_${{ matrix.wallet_variant }}.mp4 &
          echo "RECORDER_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run E2E Dogtail Test
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          BACKUP_EMAIL_ID: ${{ secrets.BACKUP_EMAIL_ID }}
          BACKUP_EMAIL_PASSWORD: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
          GOOGLE_AUTHENTICATOR: ${{ secrets.GOOGLE_AUTHENTICATOR }}
        uses: ./.github/actions/setup-e2e-environment
        with:
          test-file: ${{ matrix.test_file }}
          wallet-variant: ${{ matrix.wallet_variant }}

      - name: Stop screen recording
        if: always()
        run: |
          # Stop ffmpeg gracefully
          if [ -n "$RECORDER_PID" ]; then
            kill -INT $RECORDER_PID 2>/dev/null || true
            sleep 3
            # Force kill if still running
            kill -9 $RECORDER_PID 2>/dev/null || true
          fi

      - name: Upload screen recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-recording-${{ matrix.test_file }}-${{ matrix.wallet_variant }}
          path: /tmp/test_recording_${{ matrix.test_file }}_${{ matrix.wallet_variant }}.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test_file }}-${{ matrix.wallet_variant }}
          path: allure-results/${{ matrix.test_file }}-${{ matrix.wallet_variant }}/
          retention-days: 7
          if-no-files-found: ignore

