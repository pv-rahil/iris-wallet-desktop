name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gobject-introspection \
            libgirepository1.0-dev \
            libcairo2-dev \
            libffi-dev \
            build-essential \
            python3-dev \
            meson \
            ninja-build \
            pkg-config \
            gir1.2-gtk-3.0

      - name: Install Python dependencies (project)
        uses: ./.github/actions/install-python-dependencies

      - name: Generate config.py
        run: |
          cd src/utils
          python generate_config.py

      - name: Compile QT resources
        run: |
          poetry run pyside6-rcc src/resources.qrc -o src/resources_rc.py

      - name: Code quality checks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      TZ: Asia/Kolkata
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3 environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libegl1 \
            libgl1 \
            ruby-dev \
            build-essential \
            libgirepository1.0-dev \
            python3-dev \
            libfuse2 \
            gobject-introspection \
            meson \
            ninja-build \
            pkg-config \
            libcairo2-dev \
            libffi-dev \
            libhidapi-hidraw0 \
            libhidapi-libusb0 \
            libhidapi-dev
          sudo gem install fpm -f

      - name: Generate config.py
        run: |
          cd src/utils
          python generate_config.py

      - name: Preinstall keyring backends (system Python)
        run: |
          pip install keyring keyrings.alt

      - name: Install Python dependencies
        uses: ./.github/actions/install-python-dependencies

      - name: Install keyring backends in Poetry venv
        run: |
          poetry run pip install keyring keyrings.alt

      - name: Set KEYRING_HOME env
        run: |
          echo "KEYRING_HOME=$RUNNER_TEMP/keyring" >> "$GITHUB_ENV"

      - name: Ensure keyring storage directory exists
        run: |
          mkdir -p "$KEYRING_HOME"

      - name: Compile QT resources
        run: |
          poetry run pyside6-rcc src/resources.qrc -o src/resources_rc.py

      - name: Run unit tests (fail if coverage < 90%)
        run: |
          poetry run pytest -v --maxfail=1 -n 4\
            --cov=src \
            --cov-fail-under=90 \
            --cov-report=html:coverage-report \
            unit_tests/tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 7
          if-no-files-found: ignore

  build-apps:
    name: Build AppImages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install E2E system dependencies
        uses: ./.github/actions/install-e2e-dependencies

      - name: Install Python dependencies
        uses: ./.github/actions/install-python-dependencies

      - name: Preinstall keyring backends (system Python)
        run: |
          pip install keyring keyrings.alt

      - name: Install Python dependencies
        uses: ./.github/actions/install-python-dependencies

      - name: Install keyring backends in Poetry venv
        run: |
          poetry run pip install keyring keyrings.alt

      - name: Compile QT resources
        run: |
          poetry run pyside6-rcc src/resources.qrc -o src/resources_rc.py

      - name: Build all test AppImages
        run: |
          cd src/utils
          python generate_config.py
          cd ../../

      - name: Build all test AppImages
        run: |
          mkdir -p e2e_tests/applications

          poetry run build-iris-wallet --network regtest --distribution appimage --app-name test_app_1
          mv *.AppImage e2e_tests/applications/ 2>/dev/null || true

          poetry run build-iris-wallet --network regtest --distribution appimage --app-name test_app_2
          mv *.AppImage e2e_tests/applications/ 2>/dev/null || true

          poetry run build-iris-wallet --network regtest --distribution appimage --app-name test_app_3
          mv *.AppImage e2e_tests/applications/ 2>/dev/null || true

          poetry run build-iris-wallet --network regtest --distribution appimage --app-name test_app_4
          mv *.AppImage e2e_tests/applications/ 2>/dev/null || true

          echo "AppImages built:"
          ls -la e2e_tests/applications/

      - name: Upload AppImages artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimages
          path: e2e_tests/applications/*.AppImage
          retention-days: 1
          if-no-files-found: error

  e2e-dogtail:
    name: E2E Dogtail tests
    needs: build-apps
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false

      matrix:
        test_file:
          - test_keyring_dialog
          - test_receive_and_send_bitcoin
          - test_login_app_auth
          - test_ask_auth_for_imp_operations
          - test_settings
          - test_help
          - test_about
          - test_backup_and_restore
          - test_send_and_receive_nia_asset
          - test_send_and_receive_ifa_asset
          - test_send_and_receive_cfa_asset
          - test_hide_exhausted_asset
          - test_fail_transfer
          - test_issue_nia_asset
          - test_issue_ifa_asset
          - test_issue_cfa_asset
          - test_view_unspent
          - test_refresh_transfer
          - test_inflate_asset
        wallet_variant:
          # All single-sig variants
          - online_watch_only
          - online_create_on_device
          - online_create_hardware
          # - online_load_on_device
          # - online_load_hardware
          - offline_create_on_device
          - offline_create_hardware
          # - offline_load_on_device
          # - offline_load_hardware
          # All multisig variants
          # - online_multisig_on_device
          # - online_multisig_hardware
          # - offline_multisig_on_device
          # - offline_multisig_hardware
          # - online_multisig_load_on_device
          # - online_multisig_load_hardware
          # - offline_multisig_load_on_device
          # - offline_multisig_load_hardware
          # - online_multisig_watch_only

    env:
      QT_IM_MODULE: virtualkeyboard
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          name: appimages
          path: e2e_tests/applications

      - name: Make AppImages executable
        run: chmod +x e2e_tests/applications/*.AppImage

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install E2E system dependencies
        uses: ./.github/actions/install-e2e-dependencies

      - name: Setup env for GUI testing
        run: |
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> $GITHUB_ENV
          echo "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe" >> $GITHUB_ENV
          # Qt-specific software OpenGL settings
          echo "QT_OPENGL=software" >> $GITHUB_ENV
          echo "QT_QUICK_BACKEND=software" >> $GITHUB_ENV
          echo "QSG_RENDER_LOOP=basic" >> $GITHUB_ENV

      - name: Preinstall keyring backends (system Python)
        run: |
          pip install keyring keyrings.alt

      - name: Install Python dependencies
        uses: ./.github/actions/install-python-dependencies

      - name: Install keyring backends in Poetry venv
        run: |
          poetry run pip install keyring keyrings.alt

      - name: Prepare runtime Python deps for AppImage
        run: |
          RUNTIME_PYDEPS="$RUNNER_TEMP/pydeps"
          mkdir -p "$RUNTIME_PYDEPS"
          python -m pip install --target "$RUNTIME_PYDEPS" keyring keyrings.alt
          echo "PYTHONPATH=$RUNTIME_PYDEPS" >> $GITHUB_ENV

      - name: Start regtest services
        run: poetry run regtest-start

      - name: Configure Qt for accurate Dogtail positioning
        run: |
          # Qt applications use window effects and platform themes that can cause click offsets
          # Disable these for accurate Dogtail element positioning
          echo "QT_STYLE_OVERRIDE=Fusion" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORMTHEME=" >> $GITHUB_ENV
          echo "QT_ENABLE_HIGHDPI_SCALING=0" >> $GITHUB_ENV
          echo "QT_AUTO_SCREEN_SCALE_FACTOR=0" >> $GITHUB_ENV
          # Disable GTK client-side decorations to prevent window shadows from offsetting click coordinates
          echo "GTK_CSD=0" >> $GITHUB_ENV

      - name: Run E2E Dogtail Test
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          BACKUP_EMAIL_ID: ${{ secrets.BACKUP_EMAIL_ID }}
          BACKUP_EMAIL_PASSWORD: ${{ secrets.BACKUP_EMAIL_PASSWORD }}
          GOOGLE_AUTHENTICATOR: ${{ secrets.GOOGLE_AUTHENTICATOR }}
        uses: ./.github/actions/setup-e2e-environment
        with:
          test-file: ${{ matrix.test_file }}
          wallet-variant: ${{ matrix.wallet_variant }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test_file }}-${{ matrix.wallet_variant }}
          path: allure-results/${{ matrix.wallet_variant }}/
          retention-days: 7
          if-no-files-found: ignore

  publish-test-report:
    name: Publish Test Report
    needs: e2e-dogtail
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and publish reports
        uses: ./.github/actions/publish-test-reports

  cleanup-artifacts:
    name: Cleanup Artifacts
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-dogtail]
    steps:
      - name: Delete Test Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            allure-results/${{ matrix.test_file }}-${{ matrix.wallet_variant }}
            coverage-report
          failOnError: false

  cleanup-old-artifactes:
    name: Cleanup Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete all artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100
                });

                for (const artifact of artifacts.data.artifacts) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  console.log(`Deleted artifact: ${artifact.name}`);
                }
