name: Install E2E System Dependencies
description: Install all system dependencies required for E2E GUI testing with Dogtail

runs:
  using: "composite"
  steps:
    - name: Install required system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          x11-apps \
          xauth \
          openbox \
          dbus-x11 \
          policykit-1-gnome \
          lxqt-policykit \
          at-spi2-core \
          gnome-keyring \
          python3-secretstorage \
          libatk-bridge2.0-0 \
          libxcb-cursor0 \
          libxkbcommon-x11-0 \
          libxkbcommon0 \
          libxcb1 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libxcb-randr0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-shm0 \
          libxcb-glx0 \
          libxcb-render0 \
          libxcb-present0 \
          libxcb-dri3-0 \
          libxcb-xinput0 \
          libx11-xcb1 \
          libxrender1 \
          libxcomposite1 \
          libxi6 \
          libxtst6 \
          libxrandr2 \
          libxdamage1 \
          libxext6 \
          libfontconfig1 \
          libdrm2 \
          libegl1 \
          libgl1 \
          libopengl0 \
          libglu1-mesa \
          libglx-mesa0 \
          libglvnd0 \
          libgles2 \
          libgtk-3-0 \
          gir1.2-gtk-3.0 \
          gir1.2-atspi-2.0 \
          python3-gi \
          xdg-desktop-portal \
          xdg-desktop-portal-gtk \
          qt6-gtk-platformtheme \
          fonts-dejavu-core \
          adwaita-icon-theme \
          shared-mime-info \
          libgl1-mesa-dri \
          mesa-utils \
          libgirepository1.0-dev \
          meson \
          gobject-introspection \
          ninja-build \
          gsettings-desktop-schemas \
          dconf-cli \
          dconf-service \
          xclip \
          wmctrl \
          libdbus-1-3 \
          libglib2.0-0 \
          libnss3 \
          libxss1 \
          libatk1.0-0 \
          libxcb-util1 \
          ruby-dev \
          build-essential \
          libgbm1 \
          libosmesa6 \
          mesa-utils-extra \
          libfuse2 \
          scrot \
          libcairo2-dev \
          pkg-config \
          python3-dev \
          libhidapi-hidraw0 \
          libhidapi-libusb0 \
          libhidapi-dev \
          qemu-user-static \
          xserver-xorg-core \
          xserver-xorg-video-all \
          xserver-xorg-video-modesetting \
          x11-utils \
          x11-xserver-utils \
          xdotool
        sudo gem install fpm -f
      shell: bash

    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        source "$HOME/.cargo/env"
      shell: bash

    - name: Install biscuit-cli
      run: cargo install biscuit-cli
      shell: bash

    - name: Download AppImages from repo release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Create directory for AppImages
        mkdir -p e2e_tests/applications

        # Get all releases
        RELEASES_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/pv-rahil/iris-wallet-desktop/releases")

        # Download iris-wallet-vault_test_app_1 AppImage (|| true prevents grep failure)
        APP1_URL=$(echo "$RELEASES_JSON" | grep -m1 "browser_download_url.*iris-wallet-vault_test_app_1.*\.AppImage" | cut -d '"' -f 4 || true)
        if [ -n "$APP1_URL" ]; then
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o e2e_tests/applications/iris-wallet-vault_test_app_1-0.2.0-x86_64.AppImage "$APP1_URL"
          chmod +x e2e_tests/applications/iris-wallet-vault_test_app_1-0.2.0-x86_64.AppImage
          echo "iris-wallet-vault_test_app_1-0.2.0-x86_64.AppImage downloaded"
        fi

        # Download iris-wallet-vault_test_app_2 AppImage (|| true prevents grep failure)
        APP2_URL=$(echo "$RELEASES_JSON" | grep -m1 "browser_download_url.*iris-wallet-vault_test_app_2.*\.AppImage" | cut -d '"' -f 4 || true)
        if [ -n "$APP2_URL" ]; then
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o e2e_tests/applications/iris-wallet-vault_test_app_2-0.2.0-x86_64.AppImage "$APP2_URL"
          chmod +x e2e_tests/applications/iris-wallet-vault_test_app_2-0.2.0-x86_64.AppImage
          echo "iris-wallet-vault_test_app_2-0.2.0-x86_64.AppImage downloaded"
        fi

        # Download iris-wallet-vault_test_app_3 AppImage (|| true prevents grep failure)
        APP3_URL=$(echo "$RELEASES_JSON" | grep -m1 "browser_download_url.*iris-wallet-vault_test_app_3.*\.AppImage" | cut -d '"' -f 4 || true)
        if [ -n "$APP3_URL" ]; then
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o e2e_tests/applications/iris-wallet-vault_test_app_3-0.2.0-x86_64.AppImage "$APP3_URL"
          chmod +x e2e_tests/applications/iris-wallet-vault_test_app_3-0.2.0-x86_64.AppImage
          echo "iris-wallet-vault_test_app_3-0.2.0-x86_64.AppImage downloaded"
        fi

        # Download iris-wallet-vault_test_app_4 AppImage (|| true prevents grep failure)
        APP4_URL=$(echo "$RELEASES_JSON" | grep -m1 "browser_download_url.*iris-wallet-vault_test_app_4.*\.AppImage" | cut -d '"' -f 4 || true)
        if [ -n "$APP4_URL" ]; then
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o e2e_tests/applications/iris-wallet-vault_test_app_4-0.2.0-x86_64.AppImage "$APP4_URL"
          chmod +x e2e_tests/applications/iris-wallet-vault_test_app_4-0.2.0-x86_64.AppImage
          echo "iris-wallet-vault_test_app_4-0.2.0-x86_64.AppImage downloaded"
        fi

        # List downloaded AppImages
        echo "Downloaded AppImages:"
        ls -la e2e_tests/applications/ 2>/dev/null || echo "No AppImages found in releases"
      shell: bash
